<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shelly PDF</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header id="toolbar">
    <button id="btn-sidebar" class="icon" title="Toggle thumbnails (Ctrl+B)">&#9776;</button>
    <button id="btn-open" title="Open a PDF (Ctrl+O)">Open</button>
    <span class="sep"></span>

    <button id="btn-prev" class="icon" title="Previous page">&#9650;</button>
    <input id="page-num" type="number" min="1" value="1" disabled />
    <span id="page-total" class="dim">/ 0</span>
    <button id="btn-next" class="icon" title="Next page">&#9660;</button>
    <span class="sep"></span>

    <button id="btn-zoom-out" class="icon" title="Zoom out">&minus;</button>
    <select id="zoom-select" title="Zoom">
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
      <option value="4">400%</option>
      <option value="fit-width" selected>Fit width</option>
      <option value="fit-page">Fit page</option>
    </select>
    <button id="btn-zoom-in" class="icon" title="Zoom in">+</button>
    <span class="sep"></span>

    <div class="tool-group">
      <button id="tool-select" class="tool active" title="Select / pan">Select</button>
      <button id="tool-edittext" class="tool" title="Click an existing line of text to change it">Edit Text</button>
      <button id="tool-highlight" class="tool" title="Drag over text to highlight it">Highlight</button>
      <button id="tool-text" class="tool" title="Click a page to add a text box">+ Text</button>
      <button id="tool-note" class="tool" title="Click a page to add a sticky note">+ Note</button>
      <button id="tool-image" class="tool" title="Place an image on a page">+ Image</button>
      <button id="tool-sign" class="tool" title="Draw a signature and place it">Sign</button>
      <button id="tool-redact" class="tool" title="Drag a box over content to redact — permanently removed on save">Redact</button>
    </div>
    <button id="btn-stamp" disabled title="Stamp a diagonal watermark across pages">Stamp</button>
    <span id="text-props">
      <select id="text-font" title="Font">
        <option value="Helvetica" selected>Helvetica</option>
        <option value="TimesRoman">Times</option>
        <option value="Courier">Courier</option>
      </select>
      <input id="text-size" type="number" min="6" max="96" value="16" title="Font size (pt)" />
      <input id="text-color" type="color" value="#d92626" title="Text color" />
      <label class="dim checkbox" title="White fill behind the text &mdash; covers what's underneath">
        <input id="text-bg" type="checkbox" /> Fill
      </label>
    </span>
    <span id="hl-props">
      <input id="hl-color" type="color" value="#ffe066" title="Highlight color" />
    </span>
    <button id="btn-ocr" disabled title="Recognize text on scanned pages (OCR) so they become searchable">OCR</button>
    <span class="spacer"></span>

    <button id="btn-find" class="icon" title="Find (Ctrl+F)">&#128269;</button>
    <button id="btn-undo" class="icon" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
    <button id="btn-redo" class="icon" title="Redo (Ctrl+Shift+Z)" disabled>&#8631;</button>
    <span class="sep"></span>
    <button id="btn-save" disabled title="Save (Ctrl+S)">Save</button>
    <button id="btn-save-as" disabled title="Save As (Ctrl+Shift+S)">Save As</button>
    <button id="btn-print" class="icon" disabled title="Print (Ctrl+P)">&#128424;</button>
  </header>

  <div id="tabbar" hidden></div>

  <div id="main">
    <aside id="sidebar">
      <div id="sidebar-tabs">
        <button id="side-pages" class="active">Pages</button>
        <button id="side-marks">Bookmarks</button>
      </div>
      <div id="thumb-actions">
        <button id="pg-rotate-l" class="icon" title="Rotate left 90&deg;" disabled>&#8634;</button>
        <button id="pg-rotate-r" class="icon" title="Rotate right 90&deg;" disabled>&#8635;</button>
        <button id="pg-delete" class="icon" title="Delete page(s)" disabled>&#128465;</button>
        <button id="pg-extract" class="icon" title="Extract page(s) to a new PDF" disabled>&#8659;</button>
        <button id="pg-insert" class="icon" title="Insert pages from another PDF" disabled>&#10133;</button>
      </div>
      <div id="thumbs-host"></div>
    </aside>

    <div id="viewer-wrap">
      <div id="findbar" hidden>
        <input id="find-input" type="text" placeholder="Find in document&hellip;" />
        <span id="find-count" class="dim"></span>
        <button id="find-prev" class="icon" title="Previous match (Shift+Enter)">&#9650;</button>
        <button id="find-next" class="icon" title="Next match (Enter)">&#9660;</button>
        <button id="find-close" class="icon" title="Close (Esc)">&#10005;</button>
      </div>
      <div id="viewers"></div>
      <div id="empty-state">
        <div class="logo">Shelly&nbsp;PDF</div>
        <p>Drop PDFs anywhere, or</p>
        <button id="empty-open">Open PDFs&hellip;</button>
        <div id="recent" hidden>
          <h4>Recent</h4>
          <div id="recent-list"></div>
        </div>
      </div>
      <div id="toast" hidden></div>
    </div>
  </div>

  <footer id="statusbar">
    <span id="status-file">No document</span>
    <span class="spacer"></span>
    <span id="status-info"></span>
  </footer>

  <dialog id="wm-dialog">
    <h3>Stamp watermark</h3>
    <div class="dialog-grid">
      <label>Text</label>
      <input id="wm-text" type="text" value="CONFIDENTIAL" />
      <label>Color</label>
      <input id="wm-color" type="color" value="#c0392b" />
      <label>Opacity</label>
      <input id="wm-opacity" type="range" min="5" max="60" value="15" />
      <label>Pages</label>
      <select id="wm-scope">
        <option value="all" selected>All pages</option>
        <option value="current">Current page only</option>
      </select>
    </div>
    <div class="dialog-row">
      <span class="dim">Applied into the pages; use Undo to remove.</span>
      <span class="spacer"></span>
      <button id="wm-cancel">Cancel</button>
      <button id="wm-apply" class="primary">Apply</button>
    </div>
  </dialog>

  <dialog id="pw-dialog">
    <h3>Password required</h3>
    <p id="pw-message" class="dim"></p>
    <input id="pw-input" type="password" placeholder="Password" autocomplete="off" />
    <div class="dialog-row">
      <span class="spacer"></span>
      <button id="pw-cancel">Cancel</button>
      <button id="pw-open" class="primary">Open</button>
    </div>
  </dialog>

  <dialog id="sign-dialog">
    <h3>Draw your signature</h3>
    <canvas id="sign-canvas" width="1000" height="320"></canvas>
    <div class="dialog-row">
      <label>Ink
        <select id="sign-color">
          <option value="#14151a">Black</option>
          <option value="#1a3f9e">Blue</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button id="sign-clear">Clear</button>
      <button id="sign-cancel">Cancel</button>
      <button id="sign-use" class="primary">Use signature</button>
    </div>
  </dialog>

  <!-- Fallbacks used when running outside Electron (dev/testing in a browser) -->
  <input id="file-fallback" type="file" accept="application/pdf" multiple hidden />
  <input id="image-fallback" type="file" accept="image/png,image/jpeg" hidden />

  <script type="module" src="./app.js"></script>
</body>
</html>
